# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names; The default value is --autogenerate
# file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with project directory
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py file
# sourceless = false

# Version location specification; This defaults to migrations/versions.
version_locations = migrations/versions

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# sqlalchemy.url is dynamically populated in migrations/env.py from backend.config
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/plant_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
